{% extends "base.html" %}

{% block title %}Eve – Choose New Password{% endblock %}

{% block content %}
    <h1>Choose a new password</h1>
    {% if validlink %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Set new password</button>
        </form>
    {% else %}
        <p>This reset link is invalid or has already been used.
           <a href="{% url 'password_reset' %}">Request a new one.</a></p>
    {% endif %}
{% endblock %}
