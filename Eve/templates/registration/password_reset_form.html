{% extends "base.html" %}

{% block title %}Eve – Reset Password{% endblock %}

{% block content %}
    <h1>Reset your password</h1>
    <p>Enter your email address and we will send you a reset link.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Send reset link</button>
    </form>
{% endblock %}
