# Reverse proxy in front of Gunicorn. TLS termination is expected one layer
# above (load balancer) or here — add a TLS server block for the latter.
upstream eve_app {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Mirror Django's DATA_UPLOAD_MAX_MEMORY_SIZE
    client_max_body_size 1m;

    # Dedicated static-file layer (collectstatic output). Swap this block
    # for object-storage/CDN URLs in larger deployments.
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://eve_app;
        proxy_set_header Host $host;
        # Overwrites any client-supplied value — this is what makes
        # TRUSTED_PROXIES and SECURE_PROXY_SSL_HEADER safe to trust.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Lets the app measure time spent queued before a worker picked the
        # request up (worker-saturation signal, docs/OBSERVABILITY.md)
        proxy_set_header X-Request-Start "t=$msec";
        proxy_redirect off;
    }
}
