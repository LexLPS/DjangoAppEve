# Production-shaped local stack: nginx -> gunicorn (stateless web) with
# PostgreSQL, MongoDB, and Redis. Real deployments use managed equivalents;
# this file documents the architecture and serves staging/local testing.
services:
  web:
    build: .
    env_file: .env
    environment:
      DJANGO_ENV: prod
      DB_HOST: postgres
      MONGODB_URI: "mongodb://mongo:27017"
      REDIS_URL: "redis://redis:6379/0"
      GUNICORN_FORWARDED_ALLOW_IPS: "*"   # only nginx can reach this port
      DJANGO_TRUSTED_PROXIES: ""           # set to the nginx container IP/CIDR
    expose:
      - "8000"
    volumes:
      - static_files:/app/staticfiles
    depends_on:
      - postgres
      - mongo
      - redis

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
    depends_on:
      - web

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-eve_db}
      POSTGRES_USER: ${DB_USER:-eve_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy volatile-lru

volumes:
  static_files:
  pg_data:
  mongo_data:
